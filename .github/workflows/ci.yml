name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install core + dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Static checks (ruff)
        run: ruff check .

      - name: Offline test suite (no API key required)
        env:
          OPENAI_API_KEY: ""
        run: pytest -q

      - name: Synthetic end-to-end example
        run: python examples/offline_demo.py
