name: Deploy showcase to GitHub Pages

# Deploys the static field-notes dashboard (site/) to GitHub Pages.
# The site is plain HTML/CSS/JS over a frozen data.js generated by
# scripts/build_showcase_data.py — no server, no API keys, no build step.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/build_showcase_data.py'
      - '.github/workflows/pages-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
